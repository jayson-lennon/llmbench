[package]
name = "llmbench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.51", features = ["derive", "env"] }
dotenvy = { version = "0.15.7", features = ["clap", "cli"] }
error-stack = { version = "0.6.0", features = ["hooks", "spantrace"] }
glob = "0.3.3"
openrouter = { path = "vendor/openrouter" }
ordered-float = { version = "5.1.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# openrouter = "0.2.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
twox-hash = "2.1.2"
